<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Card Gradients -->
    <linearGradient id="cardRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A5F" />
      <stop offset="100%" stop-color="#E02424" />
    </linearGradient>
    <linearGradient id="cardYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="cardGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    
    <!-- Badge Gradient -->
    <linearGradient id="starBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-20%" y="-20%" width="150%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35" />
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Left Red Card (Tilted Left) -->
  <g transform="translate(18, 22) rotate(-14 20 40)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="38" height="58" rx="7" fill="url(#cardRed)" />
    <!-- Mini card lines / preview -->
    <rect x="6" y="8" width="18" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.8" />
    <rect x="6" y="16" width="26" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.5" />
    <rect x="6" y="23" width="22" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.5" />
    <rect x="6" y="30" width="24" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.5" />
  </g>

  <!-- Middle Yellow/Amber Card (Center upright) -->
  <g transform="translate(41, 16)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="38" height="60" rx="7" fill="url(#cardYellow)" />
    <!-- Mini card lines -->
    <rect x="6" y="8" width="18" height="4" rx="2" fill="#78350F" fill-opacity="0.8" />
    <rect x="6" y="16" width="26" height="3" rx="1.5" fill="#78350F" fill-opacity="0.45" />
    <rect x="6" y="23" width="20" height="3" rx="1.5" fill="#78350F" fill-opacity="0.45" />
    <rect x="6" y="30" width="24" height="3" rx="1.5" fill="#78350F" fill-opacity="0.45" />
    <rect x="6" y="37" width="16" height="3" rx="1.5" fill="#78350F" fill-opacity="0.45" />
  </g>

  <!-- Right Green/Emerald Card (Tilted Right) -->
  <g transform="translate(62, 18) rotate(14 20 40)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="38" height="58" rx="7" fill="url(#cardGreen)" />
    <!-- Mini card lines -->
    <rect x="6" y="8" width="18" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.8" />
    <rect x="6" y="16" width="26" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.5" />
    <rect x="6" y="23" width="20" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.5" />
    <rect x="6" y="30" width="24" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.5" />
  </g>

  <!-- Sparkles -->
  <!-- Top left sparkle -->
  <path d="M 22 14 Q 22 19 25 19 Q 22 19 22 24 Q 22 19 19 19 Q 22 19 22 14 Z" fill="#FDE047" />
  <!-- Top right sparkle -->
  <path d="M 98 22 Q 98 26 101 26 Q 98 26 98 30 Q 98 26 95 26 Q 98 26 98 22 Z" fill="#6EE7B7" />
  <!-- Small center sparkle -->
  <circle cx="36" cy="10" r="1.5" fill="#FFFFFF" />

  <!-- Star Badge (Circle with 5-pointed Star) -->
  <g transform="translate(68, 62)" filter="url(#badgeShadow)">
    <!-- Red outer ring / rosette -->
    <circle cx="16" cy="16" r="16" fill="#DC2626" />
    <circle cx="16" cy="16" r="14" fill="url(#starBadge)" />
    <!-- Star icon -->
    <polygon points="16,6 19,12.5 26,13.2 21,18 22.4,25 16,21.5 9.6,25 11,18 6,13.2 13,12.5" fill="#DC2626" />
  </g>
</svg>
